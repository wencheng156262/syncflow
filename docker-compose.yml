services:
  mysql:
    image: mysql:8.0
    container_name: syncflow-mysql
    restart: unless-stopped
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-syncflow}
      MYSQL_USER: ${MYSQL_USER:-syncflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-syncflow123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: syncflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-syncflow}
      MYSQL_USER: ${MYSQL_USER:-syncflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-syncflow123}
      REDIS_ADDR: redis:6379
      QUEUE_NAME: ${QUEUE_NAME:-syncflow:jobs}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_FILE_SIZE_MB: ${MAX_UPLOAD_FILE_SIZE_MB:-10}
      MAX_RECORDS_PER_JOB: ${MAX_RECORDS_PER_JOB:-10000}
      MAX_JOB_RETRIES: ${MAX_JOB_RETRIES:-2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "worker.worker"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-syncflow}
      MYSQL_USER: ${MYSQL_USER:-syncflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-syncflow123}
      REDIS_ADDR: redis:6379
      QUEUE_NAME: ${QUEUE_NAME:-syncflow:jobs}
      MAX_RECORDS_PER_JOB: ${MAX_RECORDS_PER_JOB:-10000}
      MAX_JOB_RETRIES: ${MAX_JOB_RETRIES:-2}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-300}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-30}
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
